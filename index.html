<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ECDICT 單字快刷機</title>
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; background: #f0f2f5; 
        }
        .card {
            background: white; width: 85%; max-width: 450px; min-height: 300px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-radius: 30px; box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            text-align: center; margin-bottom: 40px; padding: 25px; box-sizing: border-box;
        }
        .en { font-size: 48px; color: #007aff; font-weight: bold; margin-bottom: 15px; word-break: break-all; }
        .ch { font-size: 22px; color: #333; line-height: 1.5; text-align: left; width: 100%; }
        
        .loader-text { font-size: 18px; color: #666; }

        button {
            background: #007aff; color: white; border: none;
            padding: 18px 50px; border-radius: 40px; font-size: 22px;
            font-weight: bold; box-shadow: 0 8px 15px rgba(0,122,255,0.3);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="card" id="mainCard" onclick="next()">
    <div id="content">
        <div class="loader-text">正在連線至 ECDICT 資料庫...</div>
    </div>
</div>

<button id="nextBtn" onclick="next()" style="display:none;">下一張</button>

<script>
    let db = [];
    // 直接連線到 ECDICT 預處理的 Level 1 核心詞庫
    const dbUrl = 'https://raw.githubusercontent.com/skywind3000/ECDICT-Ultimate/master/precompiled/level1.json';

    // 抓取資料
    fetch(dbUrl)
        .then(r => r.json())
        .then(data => {
            db = data;
            document.getElementById('nextBtn').style.display = 'block';
            next();
        })
        .catch(err => {
            document.getElementById('content').innerHTML = '<div class="loader-text" style="color:red">連線失敗，請重新整理網頁</div>';
        });

    function next() {
        if (db.length === 0) return;

        // 隨機選取一個單字
        const cur = db[Math.floor(Math.random() * db.length)];
        
        // 格式化翻譯內容：將 \n 換行符號轉為網頁換行
        const formattedTrans = cur.translation.replace(/\\n/g, '<br>');

        document.getElementById('content').innerHTML = `
            <div class="en">${cur.word}</div>
            <div class="ch">${formattedTrans}</div>
        `;
    }
</script>

</body>
</html>
