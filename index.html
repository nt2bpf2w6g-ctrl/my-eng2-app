<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字練習機</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f9; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; width: 85%; max-width: 400px; }
        #word { font-size: 50px; color: #007aff; margin-bottom: 20px; font-weight: bold; }
        input { width: 100%; padding: 15px; font-size: 20px; border: 2px solid #ddd; border-radius: 12px; box-sizing: border-box; text-align: center; outline: none; }
        #msg { margin-top: 20px; font-size: 18px; min-height: 24px; }
    </style>
</head>
<body>
<div class="card">
    <div id="word">---</div>
    <input type="text" id="answer" placeholder="輸入中文後按換行" autocomplete="off">
    <div id="msg"></div>
</div>
<script>
    // 先放這幾個你感興趣的單字測試，之後可以一直增加
    const words = [
        { en: "stock", ch: "股票" },
        { en: "dividend", ch: "股利" },
        { en: "camera", ch: "相機" },
        { en: "aperture", ch: "光圈" },
        { en: "safari", ch: "獵遊" },
        { en: "evidence", ch: "證據" },
        { en: "investigation", ch: "調查" }
    ];
    let cur = {};
    function next() {
        cur = words[Math.floor(Math.random() * words.length)];
        document.getElementById('word').innerText = cur.en;
        document.getElementById('answer').value = '';
        document.getElementById('msg').innerText = '';
        document.getElementById('answer').focus();
    }
    document.getElementById('answer').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const user = e.target.value.trim();
            if (user === cur.ch) {
                document.getElementById('msg').innerText = "✅ 答對了！";
                document.getElementById('msg').style.color = "green";
                setTimeout(next, 1000);
            } else {
                document.getElementById('msg').innerText = "❌ 不對喔，正確是：" + cur.ch;
                document.getElementById('msg').style.color = "red";
            }
        }
    });
    next(); // 啟動第一題
</script>
</body>
</html>
