<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字練習機</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f9; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        #word { font-size: 40px; color: #007bff; margin-bottom: 20px; }
        input { width: 80%; padding: 10px; font-size: 18px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <div id="word">載入中...</div>
        <input type="text" id="ans" placeholder="輸入中文後按 Enter" autocomplete="off">
        <div id="msg" style="margin-top:20px; font-weight:bold;"></div>
    </div>
    <script>
        let db = [];
        let cur = {};
        // 抓取基礎單字
        fetch('https://raw.githubusercontent.com/skywind3000/ECDICT-Ultimate/master/precompiled/level1.json')
            .then(r => r.json())
            .then(data => {
                db = data;
                next();
            });
        function next() {
            cur = db[Math.floor(Math.random() * db.length)];
            document.getElementById('word').innerText = cur.word;
            document.getElementById('ans').value = '';
            document.getElementById('msg').innerText = '';
        }
        document.getElementById('ans').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                let val = this.value.trim();
                if (cur.translation.includes(val) && val !== "") {
                    document.getElementById('msg').innerText = "✅ 正確！" + cur.translation;
                    document.getElementById('msg').style.color = "green";
                    setTimeout(next, 2000);
                } else {
                    document.getElementById('msg').innerText = "❌ 不對喔！參考答案：" + cur.translation;
                    document.getElementById('msg').style.color = "red";
                }
            }
        });
    </script>
</body>
</html>
