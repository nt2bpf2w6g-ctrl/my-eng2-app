<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機單字卡</title>
    <style>
        body { background: #1a1a1a; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .card { width: 90%; max-width: 380px; background: white; color: #333; border-radius: 20px; padding: 35px; text-align: center; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .en { font-size: 40px; font-weight: bold; color: #1a1a1a; margin-bottom: 10px; }
        .ch { font-size: 22px; color: #444; margin-bottom: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        .ex { font-size: 14px; color: #777; text-align: left; background: #f9f9f9; padding: 12px; border-radius: 10px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card" onclick="showNext()">
    <div id="en" class="en">點擊換單字</div>
    <div id="ch" class="ch">Loading...</div>
    <div id="ex" class="ex">正在讀取 data.json...</div>
</div>

<script>
    let words = [];

    // 抓取你在 iPad 上改好名字上傳的檔案
    fetch('data.json')
        .then(res => res.json())
        .then(data => {
            words = data;
            showNext();
        })
        .catch(err => {
            document.getElementById('en').textContent = "讀取失敗";
            document.getElementById('ex').textContent = "請確認 data.json 已上傳至 GitHub 根目錄。";
        });

    function showNext() {
        if (words.length > 0) {
            const item = words[Math.floor(Math.random() * words.length)];
            const content = item.content?.word?.content; // 根據 image_13.png 的結構
            
            document.getElementById('en').textContent = item.headWord || "N/A";
            document.getElementById('ch').textContent = content?.transCN || "無翻譯";
            
            const sentences = content?.sentence?.sentences?.[0];
            document.getElementById('ex').textContent = sentences?.sContent || "無例句資料";
        }
    }
</script>
</body>
</html>
