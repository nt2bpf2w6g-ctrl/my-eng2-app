<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>我的英文單字庫</title>
    <style>
        body { display: flex; height: 100vh; margin: 0; font-family: sans-serif; }
        /* 左側目錄 */
        #sidebar { width: 300px; border-right: 1px solid #ccc; overflow-y: auto; background: #f9f9f9; }
        #word-list { list-style: none; padding: 0; margin: 0; }
        #word-list li { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        #word-list li:hover { background: #e0e0e0; }
        /* 右側內容區 */
        #content { flex: 1; padding: 40px; }
        .word-title { font-size: 32px; color: #2c3e50; margin-bottom: 10px; }
        .detail { margin-bottom: 15px; line-height: 1.6; }
        .label { font-weight: bold; color: #7f8c8d; }
    </style>
</head>
<body>

<div id="sidebar">
    <ul id="word-list"><li>載入中...</li></ul>
</div>

<div id="content" id="display-area">
    <div id="word-info">
        <p>請從左側目錄選擇一個單字</p>
    </div>
</div>

<script>
    // 1. 讀取 JSON 檔案[span_3](start_span)[span_3](end_span)
    fetch('IELTSluan_2 2.json')
        .then(response => response.json())
        .then(data => {
            const list = document.getElementById('word-list');
            list.innerHTML = ''; // 清除「載入中」

            // 2. 自動將單字新增到目錄[span_4](start_span)[span_4](end_span)
            data.forEach((item, index) => {
                let li = document.createElement('li');
                // 這裡假設 JSON 內的 key 是 word，如果不是請根據檔案修改
                li.textContent = item.word || `單字 ${index + 1}`; 
                li.onclick = () => showDetail(item);
                list.appendChild(li);
            });
        })
        .catch(err => {
            document.getElementById('word-list').innerHTML = '讀取檔案失敗，請檢查檔名。';
            console.error(err);
        });

    // 3. 顯示單字詳細資訊的功能[span_5](start_span)[span_5](end_span)
    function showDetail(item) {
        const infoDiv = document.getElementById('word-info');
        infoDiv.innerHTML = `
            <div class="word-title">${item.word}</div>
            <div class="detail"><span class="label">詞性：</span>${item.pos || '無'}</div>
            <div class="detail"><span class="label">中文：</span>${item.meaning || '無翻譯'}</div>
            <div class="detail"><span class="label">例句：</span><br>${item.example || '無例句'}</div>
        `;
    }
</script>

</body>
</html>
