<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機單字卡</title>
    <style>
        body { background: #1a1a1a; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .card { width: 85%; max-width: 400px; background: white; border-radius: 24px; padding: 30px; text-align: center; cursor: pointer; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .en { font-size: 36px; font-weight: bold; color: #1a1a1a; margin-bottom: 10px; }
        .ch { font-size: 20px; color: #444; margin-bottom: 20px; }
        .ex { font-size: 15px; color: #666; text-align: left; background: #f0f0f0; padding: 15px; border-radius: 10px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card" onclick="showNext()">
    <div id="en" class="en">點擊開始</div>
    <div id="ch" class="ch">隨機換單字</div>
    <div id="ex" class="ex">正在讀取資料庫...</div>
</div>

<script>
    let words = [];

    // 注意！這裡的路徑要跟你 image_16.png 顯示的檔名完全一致
    const fileName = 'IELTSluan_2 2.json'; 

    fetch(fileName)
        .then(response => {
            if (!response.ok) throw new Error('讀取失敗');
            return response.json();
        })
        .then(data => {
            words = data;
            showNext();
        })
        .catch(err => {
            document.getElementById('en').textContent = "讀取失敗";
            document.getElementById('ex').textContent = "請確保 " + fileName + " 已經傳到 GitHub 了。";
            console.error(err);
        });

    function showNext() {
        if (words.length > 0) {
            const item = words[Math.floor(Math.random() * words.length)];
            const content = item.content?.word?.content;
            
            document.getElementById('en').textContent = item.headWord || "N/A";
            document.getElementById('ch').textContent = content?.transCN || "無翻譯";
            
            const sentences = content?.sentence?.sentences?.[0];
            const enEx = sentences?.sContent || "";
            const cnEx = sentences?.sCn || "";
            document.getElementById('ex').innerHTML = enEx + "<br><small style='color:#999'>" + cnEx + "</small>";
        }
    }
</script>

</body>
</html>
